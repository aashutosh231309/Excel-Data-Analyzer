# Packaging configuration for the standalone desktop application.
#
# Windows installers are produced with:  npm run dist:win
# A portable single-file build:          npm run dist:win:portable
#
# The application identity lives here and in package.json only; the version and
# the product name are read from package.json, so there is exactly one source
# for each of them.
appId: com.exceldataanalyzer.app
productName: Excel Data Analyzer
copyright: Copyright © 2026 Excel Data Analyzer

directories:
  buildResources: build
  output: release

# Only the compiled bundles are packaged: the renderer already contains React,
# Tailwind, SheetJS and Lucide, so no node_modules need to ship with the app.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!node_modules/**/*'

# Explicitly keep development-only material out of the archive, so a future
# change to the include patterns above cannot leak it into a release.
extraResources: []

asar: true

win:
  icon: build/icon.ico
  # A single, unambiguous per-user target. The `portable` target is built on
  # demand with `npm run dist:win:portable`, never by the default command.
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}
  # The application never needs elevation: it reads and writes only the files
  # the user picks and stores no data of its own.
  requestedExecutionLevel: asInvoker
  # Downloading is only needed when the build machine has no cached Electron;
  # packaging stays offline-friendly once the runtime is present.
  signAndEditExecutable: true

nsis:
  # A conventional per-user installer: no administrator prompt, the
  # installation goes to %LOCALAPPDATA%\Programs and can be removed through
  # Windows Settings → Apps.
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Excel Data Analyzer
  # Standard installer: no page the application does not actually support.
  license: null
  uninstallDisplayName: Excel Data Analyzer
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}

portable:
  # Launch without installing: the runtime unpacks the same application code
  # (renderer, preload, main process) into a temporary folder and starts it, so
  # the security architecture is identical to the installed build.
  artifactName: ${productName}-${version}-Portable.${ext}
  unicode: true
  requestExecutionLevel: user

linux:
  icon: build/icon.png
  category: Office
  target:
    - AppImage

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - dmg
